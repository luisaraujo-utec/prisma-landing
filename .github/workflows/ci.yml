# ============================================================
# PRISMA Landing · Continuous Integration
# ============================================================
# Este workflow se ejecuta en CADA push y CADA pull request.
# Verifica: calidad de código (lint), tests unitarios, build
# y que la imagen Docker se construya y arranque correctamente.
# NO publica ninguna imagen — de eso se ocupa docker-publish.yml
# ============================================================

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']     # los tags disparan docker-publish
  pull_request:
    branches: [main]

# Cancela corridas obsoletas del mismo branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principio de menor privilegio: solo lectura
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # JOB 1 · Calidad de código: lint, tests, build
  # ----------------------------------------------------------
  quality:
    name: Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint estricto · 0 warnings)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Audit de dependencias (informativo)
        # No falla el pipeline: solo genera visibilidad de vulnerabilidades
        run: npm audit --audit-level=high || true

  # ----------------------------------------------------------
  # JOB 2 · Verificación de la imagen Docker
  # ----------------------------------------------------------
  docker-verify:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true                      # deja la imagen disponible localmente
          tags: prisma-landing:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          set -euo pipefail
          echo "→ Arrancando contenedor..."
          docker run -d --name smoke -p 8080:80 prisma-landing:ci-${{ github.sha }}

          echo "→ Esperando a que Nginx responda (máx 30 s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "✓ Nginx respondió en ${i} segundo(s)"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "✗ Timeout esperando respuesta"
              docker logs smoke
              exit 1
            fi
          done

          echo "→ Verificando que la landing contiene la marca PRISMA..."
          if curl -sf http://localhost:8080/ | grep -qi "prisma"; then
            echo "✓ Marca PRISMA encontrada en el HTML servido"
          else
            echo "✗ La landing no contiene 'PRISMA'"
            docker logs smoke
            exit 1
          fi

          echo "→ Deteniendo contenedor..."
          docker stop smoke
          docker rm smoke
