server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # Cache agresivo para assets con hash (Vite genera /assets/*.[hash].js/css)
    location ~* ^/assets/.*\.(js|css|svg|woff2?|ttf|eot|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Nunca cachear el index (permite despliegues nuevos sin invalidación)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: cualquier ruta no encontrada devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'" always;

    # Ocultar la versión de nginx en las respuestas
    server_tokens off;

    # Denegar acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. { deny all; return 404; }
}
